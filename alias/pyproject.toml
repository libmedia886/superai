[project]
name = "bazaar-compute-node"
version = "0.3.0rc29"
description = "The Bazaar Compute Node Application, installed as bazaar-compute[node]"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-compute[node]==0.3.0rc29"]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.scripts]
# uv tool links only the executables of the package it installs.
bcn = "bazaar_compute_node.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = []
module-root = ""

[tool.bcn.ci]
skip = true

[tool.pyright]
include = []
