[project]
name = "superai"
version = "0.2.3"
description = "Runtime-agnostic computer node daemon for agents and channels."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "cryptography>=45.0.0",
    "jinja2>=3.1.6",
    "packaging>=25.0",
    "pydantic>=2.0.0",
    "protobug==1.0.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
    "httptools>=0.8.0",
    "python-multipart>=0.0.32",
    "yarl>=1.18",
    "markdown-it-py>=4.2.0",
    "pygments>=2.20.0",
    "authlib>=1.8.0",
    "joserfc>=1.7.5",
    "httpx2>=2.13.1",
]

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[project.scripts]
superai = "superai_node.cli:main"
superai-server = "superai_server.cli:main"

[project.entry-points."superai_node.runtimes"]
codex = "superai_node.contrib.codex.plugin:builder"
claudecode = "superai_node.contrib.claude.plugin:builder"

[project.entry-points."superai_node.channels"]
wecom = "superai_node.contrib.wecom.plugin:builder"
telegram = "superai_node.contrib.telegram.plugin:builder"
lark = "superai_node.contrib.lark.plugin:builder"

[project.entry-points."superai_node.storages"]
sqlite = "superai_node.contrib.sqlite.plugin:create_storage"

[project.entry-points."superai_server.storages"]
sqlite = "superai_server.contrib.sqlite.plugin:create_storage"

[project.entry-points."superai_node.audits"]
logging = "superai_node.contrib.logging.plugin:create_audit"
server = "superai_node.contrib.server.plugin:create_audit"

[project.entry-points."superai_node.controls"]
server = "superai_node.contrib.server.plugin:create_control"

[dependency-groups]
dev = [
    "superai-test-support",
    "pyright==1.1.408",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
superai-test-support = { path = "tests/support", editable = true }

[tool.pytest.ini_options]
# anyio arrives with starlette and brings a pytest plugin that fights
# pytest-asyncio over the event loop; the suite runs on pytest-asyncio alone
addopts = "-m 'not e2e and not system' -p no:anyio"
markers = [
    "e2e: requires a real external provider",
    "system: runs real native system services in an isolated environment",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["superai_node", "superai_server"]
