[project]
name = "bazaar-contrib-node-management"
version = "0.3.0rc28"
description = "The Bazaar Compute Node Management Contrib"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-invoke~=0.3.0rc1",
    "bazaar-contrib-audit~=0.3.0rc1",
    "bazaar-contrib-manager~=0.3.0rc1",
    "bazaar-contrib-sidecar~=0.3.0rc8",
    "bazaar-contrib-timer~=0.3.0rc7",
    "packaging>=26.0",
    "psutil>=7.2",
]

[project.entry-points."bazaar_compute_node.contribs"]
node-health = "bazaar_contrib_node_management:node_health"
node-upgrade = "bazaar_contrib_node_management:node_upgrade"

[project.entry-points."bazaar_compute_node.defaults"]
node = "bazaar_contrib_node_management:defaults"

[project.entry-points."bazaar_compute_node.remotes"]
node = "bazaar_contrib_node_management:remote"

[project.urls]
Repository = "https://github.com/yuchanns/bazaar-compute-node"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extends = "../../pyrightconfig.json"
include = ["src", "tests"]

[tool.ruff]
extend = "../../pyproject.toml"
