[project]
name = "bcn-test-support"
version = "0.1.0"
description = "Pytest plugin that keeps Bazaar Compute tests out of the real BCN_HOME"
requires-python = ">=3.14"
dependencies = []

[project.entry-points.pytest11]
bcn = "bcn_pytest"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bcn_pytest"
